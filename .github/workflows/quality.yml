name: 质量检查

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安装 ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: 执行严格质量检查
        run: bash scripts/check.sh --strict
