services:
  # ----------------------------------------------------------------------------
  # Stalwart 现代化全功能邮件服务器 (Rust 编写，极低内存占用)
  # ----------------------------------------------------------------------------
  stalwart:
    image: ${STALWART_IMAGE:-stalwartlabs/stalwart@sha256:9ed1d343243b7aa72969e372a7240b7ddea07730781d4b68a0dc3d8d51c418bb}
    container_name: stalwart-mail
    hostname: ${MAIL_HOSTNAME:-mail.onprs.online}
    restart: unless-stopped
    ports:
      # 邮件协议公网对外端口
      - "${SMTP_PORT:-25}:25"             # SMTP 入站
      - "${SMTPS_PORT:-465}:465"          # SMTPS（SSL/TLS 客户端发信）
      - "${SUBMISSION_PORT:-587}:587"     # Submission（STARTTLS 客户端发信）
      - "${IMAPS_PORT:-993}:993"          # IMAPS（SSL/TLS 客户端收信）
      - "${IMAP_PORT:-143}:143"           # IMAP（STARTTLS 客户端收信）
      - "${POP3S_PORT:-995}:995"          # POP3S（SSL/TLS 客户端收信）
      - "${POP3_PORT:-110}:110"           # POP3（客户端收信）
      - "${SIEVE_PORT:-4190}:4190"        # ManageSieve（邮件规则过滤）
      # Web 管理后台（容器内为 HTTP 8080，仅绑定 127.0.0.1，由 1Panel OpenResty 反代）
      - "${STALWART_HTTP_PORT:-127.0.0.1:4080}:8080"
    volumes:
      - ${STALWART_CONFIG_PATH:-/opt/onprs-email/stalwart-config}:/etc/stalwart
      - ${STALWART_DATA_PATH:-/opt/onprs-email/stalwart-data}:/var/lib/stalwart
      - /opt/1panel/apps/openresty/openresty/conf/ssl:/etc/ssl/1panel:ro
    networks:
      - mail-network
      - 1panel-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # 通用邮件 Ingress 接收网关 (对接 Cloudflare Email Worker Catch-all 规则)
  # ----------------------------------------------------------------------------
  email-ingress:
    build:
      context: ./services/ingress
    image: onprs-email-ingress:latest
    container_name: email-ingress-gateway
    restart: unless-stopped
    environment:
      - INGRESS_SECRET_KEY=${INGRESS_SECRET_KEY:?请在 .env 中设置 INGRESS_SECRET_KEY}
      - ACCOUNT_REGISTRATION_CODE=${ACCOUNT_REGISTRATION_CODE:-}
      - STALWART_PROVISIONING_TOKEN=${STALWART_PROVISIONING_TOKEN:-}
      - STALWART_REGISTRATION_DOMAIN_ID=${STALWART_REGISTRATION_DOMAIN_ID:-}
      - STALWART_MANAGEMENT_URL=http://stalwart:8080
      - MAIL_DOMAIN=${MAIL_DOMAIN:-onprs.online}
      - STALWART_SMTP_HOST=stalwart
      - STALWART_SMTP_PORT=25
    ports:
      - "${INGRESS_HTTP_PORT:-127.0.0.1:4082}:8080"
    volumes:
      - ${INGRESS_DATA_PATH:-/opt/onprs-email/ingress-data}:/app/data
    networks:
      - mail-network
    depends_on:
      - stalwart
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # SnappyMail Webmail 网页邮箱客户端 (超轻量现代前端)
  # ----------------------------------------------------------------------------
  webmail:
    image: ${SNAPPYMAIL_IMAGE:-djmaze/snappymail@sha256:5e3d990438809a8a49f8ac5758db03e858e6e9fc0e369e1f9e474f7664079905}
    container_name: snappymail-web
    restart: unless-stopped
    ports:
      # Webmail 页面（仅绑定 127.0.0.1，由 1Panel OpenResty 反代）
      - "${SNAPPYMAIL_HTTP_PORT:-127.0.0.1:4081}:8888"
    volumes:
      - ${SNAPPYMAIL_DATA_PATH:-/opt/onprs-email/snappymail-data}:/var/lib/snappymail/data
    networks:
      - mail-network
    depends_on:
      - stalwart
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

networks:
  mail-network:
    driver: bridge
  1panel-network:
    external: true
